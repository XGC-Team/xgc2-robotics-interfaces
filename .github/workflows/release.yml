name: release
on:
  workflow_dispatch:
    inputs:
      expected_version:
        required: true
        type: string
      expected_source_sha:
        required: true
        type: string
      prepare_action:
        type: choice
        default: release
        options: [release, compatibility-verify]
      apt_overlay_url:
        type: string
        default: ""
      dependency_set_digest:
        type: string
        default: ""
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  XGC2_APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
  XGC2_DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}
jobs:
  build-interfaces:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate central locked preparation identity
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          PREPARE_ACTION: ${{ inputs.prepare_action }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(awk '/^version:/ {print $2; exit}' .xgc2/product.yml)" = "$EXPECTED_VERSION"
          case "$PREPARE_ACTION" in release|compatibility-verify) ;; *) exit 1;; esac
          test -z "$XGC2_DEPENDENCY_SET_DIGEST" || [[ "$XGC2_DEPENDENCY_SET_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test -z "$XGC2_APT_OVERLAY_URL" || [[ "$XGC2_DEPENDENCY_SET_DIGEST" =~ ^[0-9a-f]{64}$ ]]
      - name: Build one header-only all Deb and refuse artifact overwrite
        run: .xgc2/scripts/build_debs_in_docker.sh --output-dir "$GITHUB_WORKSPACE/debs" --work-dir "$RUNNER_TEMP/interfaces-build"
      - uses: actions/upload-artifact@v4
        with:
          name: robotics-interfaces-deb-bytes
          path: debs/*.deb
          retention-days: 14
          if-no-files-found: error
  build-debs:
    name: Install and check identical interfaces Deb (${{ matrix.arch }})
    needs: build-interfaces
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: robotics-interfaces-deb-bytes
          path: debs
      - name: Actual installed ownership, ABI and missing-payload negatives
        run: |
          mapfile -t debs < <(find debs -maxdepth 1 -type f -name '*.deb')
          test "${#debs[@]}" -eq 1
          .xgc2/scripts/build_debs_in_docker.sh --deb "${debs[0]}" --architecture "${{ matrix.arch }}"
      - name: Create strict source-bound build manifest
        run: |
          version="$(awk '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs --output-dir .ci/build-manifests \
            --product libxgc2-robotics-interfaces-dev --product-version "$version" \
            --distribution focal --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.prepare_action == 'release' }}
        with:
          name: libxgc2-robotics-interfaces-dev-debs-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
